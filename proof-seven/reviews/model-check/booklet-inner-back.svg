<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="794" viewBox="0 0 1122 794"><rect width="1122" height="794" fill="white"/><style>text{font-family:Microsoft YaHei,SimSun,sans-serif;fill:#202020}</style><path d="M561 15V779" stroke="#999" stroke-dasharray="6 5"/><text x="30" y="22" font-size="12">Digital imposition check: inner-back; fold on centre line; not a physical print.</text><text x="38" y="62" font-size="16" fill="#666">页位 4 · Q08</text><text x="38" y="108" font-size="26">没开窗的时候</text><g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(38 145) scale(0.9375)"><ns0:rect width="320" height="220" fill="#fbf7eb" /><ns0:g fill="none" stroke="#4c5145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M0 85H35V118H85 M40 40H155V170H40 M65 70H133V113H65Z" /><ns0:text fill="#4c5145" stroke="none" font-size="17" font-family="Microsoft YaHei" x="72" y="61">豆花</ns0:text><ns0:path d="M170 190Q240 151 320 110 M240 190V75 M240 120L211 83 M240 104L273 65 M240 146L285 120 M238 75Q191 45 212 25Q242 8 258 36Q287 25 296 48Q300 69 274 76" /></ns0:g></g><text x="38" y="378" font-size="18"></text><text x="38" y="406" font-size="18"></text><text x="38" y="434" font-size="18">台阶数到十二级，你就看见卖豆花的小窗了。老板若没开窗，</text><text x="38" y="462" font-size="18">也别站在那里等。</text><text x="38" y="499" font-size="18"></text><text x="38" y="527" font-size="18">转弯那棵树还在。树底下总落一圈小果子，鞋底沾上会滑，先</text><text x="38" y="555" font-size="18">在边上蹭掉。到了春天，树影会先伸到墙上，比我回来得早。</text><text x="38" y="592" font-size="18"></text><text x="38" y="620" font-size="18">图稿边线：左边接十二级台阶与小窗，右边是一棵跨过纸边的</text><text x="38" y="648" font-size="18">树；树后上行去三楼平台。</text><text x="38" y="767" font-size="14">4</text><text x="599" y="62" font-size="16" fill="#666">页位 5 · Q04</text><text x="599" y="108" font-size="26">那只不肯让路的猫</text><g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(599 145) scale(0.9375)"><ns0:rect width="320" height="220" fill="#fbf7eb" /><ns0:g fill="none" stroke="#4c5145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M0 110Q62 80 80 55 M30 150V50 M30 94L5 69 M30 80L65 44" /><ns0:path d="M86 180H140V155H195V130H250" /><ns0:path d="M222 134Q218 100 240 92L242 73L256 85L270 75L271 98Q291 112 278 132Z M238 111h2 m19 0h2 M277 127Q308 104 310 130Q310 149 320 150" /><ns0:text fill="#4c5145" stroke="none" font-size="17" font-family="Microsoft YaHei" x="115" y="55">三楼</ns0:text></ns0:g></g><text x="599" y="378" font-size="18"></text><text x="599" y="406" font-size="18"></text><text x="599" y="434" font-size="18">过了树，还要上两层。三楼的人家养着一只猫，白天睡在窗台</text><text x="599" y="462" font-size="18">，傍晚睡在楼梯口。</text><text x="599" y="499" font-size="18"></text><text x="599" y="527" font-size="18">它把尾巴横在路上，你可以绕过去。别学我叫它“师傅”，那</text><text x="599" y="555" font-size="18">家阿姨听见，以为我又要借她家的锤子。</text><text x="599" y="592" font-size="18"></text><text x="599" y="620" font-size="18">图稿边线：豆花窗外那棵树的右半边接上此页左边；楼梯到猫</text><text x="599" y="648" font-size="18">蹲的三楼平台，继续往上，去向尚未画到的四楼门。</text><text x="599" y="767" font-size="14">5</text></svg>
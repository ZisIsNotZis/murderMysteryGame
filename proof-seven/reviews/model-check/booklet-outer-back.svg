<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="794" viewBox="0 0 1122 794"><rect width="1122" height="794" fill="white"/><style>text{font-family:Microsoft YaHei,SimSun,sans-serif;fill:#202020}</style><path d="M561 15V779" stroke="#999" stroke-dasharray="6 5"/><text x="30" y="22" font-size="12">Digital imposition check: outer-back; fold on centre line; not a physical print.</text><text x="38" y="62" font-size="16" fill="#666">页位 2 · Q02</text><text x="38" y="108" font-size="26">谁的名字放在前面</text><text x="38" y="153" font-size="18">原作图文：江望。</text><text x="38" y="190" font-size="18"></text><text x="38" y="218" font-size="18">本次整理与修复：________。</text><text x="38" y="255" font-size="18"></text><text x="38" y="283" font-size="18">核读者与日期：________。</text><text x="38" y="320" font-size="18"></text><text x="38" y="348" font-size="18">选择公开版范围：□原作公开图文　□更正页　□私人末页已另</text><text x="38" y="376" font-size="18">行取得双方同意　□私人末页另封。</text><text x="38" y="413" font-size="18"></text><text x="38" y="441" font-size="18">署名不是替作者决定一切。这一页可以请江望本人核读，也可</text><text x="38" y="469" font-size="18">以先标“待本人确认”，不伪造签字。</text><text x="38" y="767" font-size="14">2</text><text x="599" y="62" font-size="16" fill="#666">页位 7 · Q06</text><text x="599" y="108" font-size="26">更正可以和作品一起留下</text><text x="599" y="153" font-size="18">本次核读所确认的事实：</text><text x="599" y="190" font-size="18"></text><text x="599" y="218" font-size="18">□旧刊将江望的图文署为顾砚生，本次更正为江望原作。</text><text x="599" y="255" font-size="18"></text><text x="599" y="283" font-size="18">□“建议匿名”不等于“本人接受匿名”，旧工作记录由记录者逐</text><text x="599" y="311" font-size="18">项更正。</text><text x="599" y="348" font-size="18"></text><text x="599" y="376" font-size="18">□现存交还登记与原说明不支持梁炳偷取排印资料，相关旧指</text><text x="599" y="404" font-size="18">控应另附来源更正；梁晏的行为不能替其父继续定罪。</text><text x="599" y="441" font-size="18"></text><text x="599" y="469" font-size="18">□私人末页是否公开，由作者与收件人决定。</text><text x="599" y="506" font-size="18"></text><text x="599" y="534" font-size="18">尚待核实、不在今晚替别人保证的事：________。</text><text x="599" y="571" font-size="18"></text><text x="599" y="599" font-size="18">已通知的旧版或预览渠道：________。</text><text x="599" y="636" font-size="18"></text><text x="599" y="664" font-size="18">可以删去尚未核完的一项并留待查，不要求漂亮地填满所有空</text><text x="599" y="692" font-size="18">格。</text><text x="599" y="767" font-size="14">7</text></svg>
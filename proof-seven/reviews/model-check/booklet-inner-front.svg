<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="794" viewBox="0 0 1122 794"><rect width="1122" height="794" fill="white"/><style>text{font-family:Microsoft YaHei,SimSun,sans-serif;fill:#202020}</style><path d="M561 15V779" stroke="#999" stroke-dasharray="6 5"/><text x="30" y="22" font-size="12">Digital imposition check: inner-front; fold on centre line; not a physical print.</text><text x="38" y="62" font-size="16" fill="#666">页位 6 · Q01</text><text x="38" y="108" font-size="26">门上的月牙</text><g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(38 145) scale(0.9375)"><ns0:rect width="320" height="220" fill="#fbf7eb" /><ns0:g fill="none" stroke="#4c5145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M0 150Q28 155 45 140 M42 180H95V153H135V45H250V180 M151 180V62H232V180 M213 120h2" /><ns0:path d="M195 76Q178 96 201 100" /><ns0:circle cx="280" cy="133" r="13" /><ns0:path d="M280 146V188h20 m-20-10h14" /><ns0:text fill="#4c5145" stroke="none" font-size="17" font-family="Microsoft YaHei" x="133" y="31">四楼</ns0:text><ns0:text fill="#4c5145" stroke="none" font-size="17" font-family="Microsoft YaHei" x="255" y="207">新钥匙</ns0:text></ns0:g></g><text x="38" y="378" font-size="18"></text><text x="38" y="406" font-size="18"></text><text x="38" y="434" font-size="18">四楼最里面那扇门，有一道月牙似的划痕。不是暗号，是我上</text><text x="38" y="462" font-size="18">回搬柜子碰的。</text><text x="38" y="499" font-size="18"></text><text x="38" y="527" font-size="18">你把新钥匙放在鞋带旁试过了，我还记得你说比旧的轻。若我</text><text x="38" y="555" font-size="18">赶不及回来，你先开门。灶旁蓝罐里有零钱，豆花的碗明天再</text><text x="38" y="583" font-size="18">还。</text><text x="38" y="620" font-size="18"></text><text x="38" y="648" font-size="18">图稿边线：楼梯向上收在一扇带月牙划痕的门，门旁画一把小</text><text x="38" y="676" font-size="18">钥匙。来路接着猫蹲的三楼平台。</text><text x="38" y="767" font-size="14">6</text><text x="599" y="62" font-size="16" fill="#666">页位 3 · Q07</text><text x="599" y="108" font-size="26">先数脚下的台阶</text><g xmlns:ns0="http://www.w3.org/2000/svg" transform="translate(599 145) scale(0.9375)"><ns0:rect width="320" height="220" fill="#fbf7eb" /><ns0:g fill="none" stroke="#4c5145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M22 154V80H84V154 M19 80H88 M30 95H75 M36 154V114H66V154" /><ns0:path d="M82 170H124V153H164V136H204V119H244V102H282V85H320" /><ns0:text fill="#4c5145" stroke="none" font-size="17" font-family="Microsoft YaHei" x="26" y="67">校门</ns0:text><ns0:text fill="#4c5145" stroke="none" font-size="17" font-family="Microsoft YaHei" x="125" y="195">十二级台阶</ns0:text></ns0:g></g><text x="599" y="378" font-size="18"></text><text x="599" y="406" font-size="18"></text><text x="599" y="434" font-size="18">从学校回家，不要数亮着的窗。先数脚下的台阶。</text><text x="599" y="471" font-size="18"></text><text x="599" y="499" font-size="18">校门口那盏灯有时不亮，你也认得第一块缺角的砖。往上十二</text><text x="599" y="527" font-size="18">级，墙边会有一个卖豆花的小窗。</text><text x="599" y="564" font-size="18"></text><text x="599" y="592" font-size="18">图稿边线：此页从校门起笔，上行楼梯在右边断开，缺角砖后</text><text x="599" y="620" font-size="18">有十二道短阶，接向下一页的小窗。</text><text x="599" y="767" font-size="14">3</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="794" viewBox="0 0 1122 794"><rect width="1122" height="794" fill="white"/><style>text{font-family:Microsoft YaHei,SimSun,sans-serif;fill:#202020}</style><path d="M561 15V779" stroke="#999" stroke-dasharray="6 5"/><text x="30" y="22" font-size="12">Digital imposition check: outer-front; fold on centre line; not a physical print.</text><text x="38" y="62" font-size="16" fill="#666">页位 8 · Q03</text><text x="38" y="108" font-size="26">私人原页另封</text><text x="38" y="153" font-size="18">本册此页留空。私人原页另封，未列入本次公开范围。后续如</text><text x="38" y="181" font-size="18">公开，须由作者与收件人分别确认。</text><text x="38" y="767" font-size="14">8</text><text x="599" y="62" font-size="16" fill="#666">页位 1 · Q05</text><text x="599" y="108" font-size="26">封面</text><text x="599" y="153" font-size="18"> 春天借住在四楼</text><text x="599" y="190" font-size="18"></text><text x="599" y="218" font-size="18">一册认路的图画笔记。</text><text x="599" y="255" font-size="18"></text><text x="599" y="283" font-size="18">这张封面可以保留原标题，也可请作者同意后改题。不要把顾</text><text x="599" y="311" font-size="18">砚生的旧署名直接贴回去；前页作者信息需按已核材料填写。</text><text x="599" y="348" font-size="18"></text><text x="599" y="376" font-size="18">封面图：从校门到四楼，一条路伸进一扇有月牙划痕的门。</text><text x="599" y="767" font-size="14">1</text></svg>